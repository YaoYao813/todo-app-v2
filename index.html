<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo列表 V3.0 TypeScript 版</title>
    <link rel="icon" href="data:,">
    <style>
        .todo-container {
            width: 400px;
            margin: 50px auto;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        #todoInput {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            outline: none;
        }
        #todoInput:focus {
            border-color: #1677ff;
        }
        #addBtn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #1677ff;
            color: #fff;
            cursor: pointer;
        }
        #addBtn:hover {
            background: #4096ff;
        }
        .input-hint {
            margin: 0 0 16px;
            color: #999;
            font-size: 12px;
        }
        .filter-area {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-btn {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            color: #555;
            cursor: pointer;
        }
        .filter-btn.active {
            border-color: #1677ff;
            color: #1677ff;
        }
        #todoList {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #todoList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        #todoList li:last-child {
            border-bottom: none;
        }
        #todoList li.done .task-text {
            color: #bbb;
            text-decoration: line-through;
        }
        .task-text {
            flex: 1;
            word-break: break-word;
        }
        .task-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }
        .del-btn,
        .edit-btn {
            border: none;
            background: transparent;
            color: #bbb;
            line-height: 1;
            cursor: pointer;
        }
        .del-btn {
            font-size: 16px;
        }
        .edit-btn {
            font-size: 13px;
        }
        .del-btn:hover {
            color: #ff4d4f;
        }
        .edit-btn:hover {
            color: #1677ff;
        }
    </style>
</head>
<body>
    <div class="todo-container">
        <div class="input-area">
            <input type="text" id="todoInput" placeholder="输入待办事项">
            <button id="addBtn">添加</button>
        </div>
        <p class="input-hint">内容会自动去除首尾空格，最多 200 字。</p>
        <div class="filter-area">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">未完成</button>
            <button class="filter-btn" data-filter="done">已完成</button>
        </div>
        <ul id="todoList"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
